name: Test installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test-install.ps1
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        run: sh tests/test-install.sh
